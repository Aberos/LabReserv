services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - database_data:/var/opt/mssql
    networks:
      - labreserve-network

  migrations:
    build:
      context: .
      dockerfile: src/LabReserve.Migrations/Dockerfile
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__Default=Server=sqlserver;Database=labreserve;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    networks:
      - labreserve-network

  webapp:
    build:
      context: .
      dockerfile: src/LabReserve.WebApp/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ConnectionStrings__Default=Server=sqlserver;Database=labreserve;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
    networks:
      - labreserve-network

volumes:
  database_data:
    driver: local

networks:
  labreserve-network:
    driver: bridge
